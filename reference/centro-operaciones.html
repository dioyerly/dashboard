<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= IDENTIDAD NEUTRAL DEL ECOSISTEMA ================= */
:root{
  --bg:#F7F3EC; --bg-2:#EFE9DF; --panel:#FFFDFC; --panel-2:#FAF6F0;
  --line:#D8DDD9; --line-2:#C3CBC7; --ink:#292D2F; --ink-2:#4A5356; --muted:#7A8487;
  --struct:#173F4F; --struct-2:#1F5468; --struct-ink:#F3EFE7;
  --pos:#3F7D65; --pos-bg:#E2EEE7; --gold:#C5A46D; --gold-bg:#F5ECDC; --coral:#C96C52; --coral-bg:#F7E3DC;
  --warn:#B9822F; --warn-bg:#F7EBD5; --info:#2D6A80; --info-bg:#E1EDF1;
  --c1:#173F4F; --c2:#C5A46D; --c3:#3F7D65; --c4:#C96C52; --c5:#6E8CA0; --c6:#8B5A8E; --c7:#9EAD9D; --c8:#B9A68A;
  --dot:rgba(23,63,79,.10);
  --lens-a:#173F4F; --lens-b:#C5A46D; --lens-ink:#173F4F; --lens-soft:#E4ECEE;
  --shadow:0 1px 2px rgba(23,63,79,.06),0 10px 28px -16px rgba(23,63,79,.28);
  --shadow-lg:0 30px 70px -24px rgba(16,40,50,.5);
  --r:18px;
  --head:'Space Grotesk',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1416; --bg-2:#121C1F; --panel:#162226; --panel-2:#1B292D; --line:#26383C; --line-2:#33494E; --ink:#ECE8E1; --ink-2:#C8CDCB; --muted:#8C9B9E;
    --struct:#7FC1D4; --struct-2:#9BD2E1; --struct-ink:#0D1416; --pos:#73C29E; --pos-bg:#173229; --gold:#DDBE86; --gold-bg:#2E2718; --coral:#E8907A; --coral-bg:#3A221C;
    --warn:#E8B565; --warn-bg:#332815; --info:#7FC1D4; --info-bg:#16303A;
    --c1:#7FC1D4; --c2:#DDBE86; --c3:#73C29E; --c4:#E8907A; --c5:#A3B8C7; --c6:#C79BCA; --c7:#B7C6B6; --c8:#7C8F93;
    --dot:rgba(127,193,212,.08); --lens-a:#7FC1D4; --lens-b:#DDBE86; --lens-ink:#7FC1D4; --lens-soft:#1B2D33; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1416; --bg-2:#121C1F; --panel:#162226; --panel-2:#1B292D; --line:#26383C; --line-2:#33494E; --ink:#ECE8E1; --ink-2:#C8CDCB; --muted:#8C9B9E;
  --struct:#7FC1D4; --struct-2:#9BD2E1; --struct-ink:#0D1416; --pos:#73C29E; --pos-bg:#173229; --gold:#DDBE86; --gold-bg:#2E2718; --coral:#E8907A; --coral-bg:#3A221C;
  --warn:#E8B565; --warn-bg:#332815; --info:#7FC1D4; --info-bg:#16303A;
  --c1:#7FC1D4; --c2:#DDBE86; --c3:#73C29E; --c4:#E8907A; --c5:#A3B8C7; --c6:#C79BCA; --c7:#B7C6B6; --c8:#7C8F93;
  --dot:rgba(127,193,212,.08); --lens-a:#7FC1D4; --lens-b:#DDBE86; --lens-ink:#7FC1D4; --lens-soft:#1B2D33; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:-.02em;margin:0}
.mono{font-family:var(--mono);font-feature-settings:"zero" 1}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11px} .right{text-align:right} .nowrap{white-space:nowrap} .num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ================= BARRA SUPERIOR ================= */
.env-strip{height:4px;background:repeating-linear-gradient(135deg,var(--warn) 0 10px,transparent 10px 20px)}
.topbar{position:sticky;top:0;z-index:40;padding:12px 24px;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.logo{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo-mark{width:38px;height:38px;position:relative;flex:none}
.logo-mark svg{width:38px;height:38px}
.orbit{transform-origin:19px 19px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-txt b{display:block;font-family:var(--head);font-size:15px;line-height:1.1}
.logo-txt span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lens{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;margin:0 auto;position:relative;box-shadow:var(--shadow)}
.lens button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;color:var(--ink-2);position:relative;z-index:1;transition:color .25s;white-space:nowrap}
.lens button.on{color:var(--struct-ink)}
.lens .dots{display:inline-flex;gap:2px}
.lens .dots i{width:7px;height:7px;border-radius:50%;display:block}
.lens-pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--lens-a);transition:all .45s cubic-bezier(.2,.9,.25,1.15);z-index:0}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.cmd-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);min-width:210px;transition:border-color .2s,box-shadow .2s}
.cmd-btn:hover{border-color:var(--lens-a);box-shadow:0 0 0 4px color-mix(in srgb,var(--lens-a) 12%,transparent)}
.cmd-btn kbd,.kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2)}
.period-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px}
.period-btn .mono{font-size:11px;color:var(--muted);font-weight:400}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--bg-2)} .icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:17px;height:17px}

/* ================= TICKER ================= */
.ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap;position:relative;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker-track{display:inline-flex;gap:34px;padding:8px 0;animation:tick 48s linear infinite;font-family:var(--mono);font-size:12px}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.ticker-track b{color:var(--ink);font-weight:600}
.ticker-track .up{color:var(--pos)} .ticker-track .down{color:var(--coral)}
.ticker-track i{width:6px;height:6px;border-radius:50%;background:var(--lens-a);display:inline-block}
@keyframes tick{to{transform:translateX(-50%)}}

/* ================= DOCK ================= */
.dock-wrap{position:fixed;left:0;right:0;bottom:16px;z-index:50;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.dock{pointer-events:auto;display:flex;align-items:flex-end;gap:4px;padding:8px 10px;border-radius:22px;background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(16,40,50,.55);max-width:100%;overflow-x:auto;scrollbar-width:none}
.dock a,.dock button{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;color:var(--ink-2);text-decoration:none;border:0;background:none;cursor:pointer;flex:none;transition:transform .22s cubic-bezier(.3,1.6,.5,1),background .2s,width .22s,height .22s}
.dock a svg,.dock button svg{width:21px;height:21px}
.dock a:hover,.dock button:hover{transform:translateY(-8px) scale(1.18);background:var(--bg-2)}
.dock a.active{background:var(--lens-a);color:var(--struct-ink)}
.dock a.active::after{content:"";position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--lens-a)}
.dock .sep{width:1px;height:30px;background:var(--line);margin:0 4px 7px;flex:none}
.dock .create{background:linear-gradient(135deg,var(--lens-a),var(--lens-b));color:#fff;box-shadow:0 8px 20px -8px var(--lens-a)}
.dock .create:hover{background:linear-gradient(135deg,var(--lens-a),var(--lens-b))}
.dock-tip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;font-family:var(--sans)}
.dock a:hover .dock-tip,.dock button:hover .dock-tip{opacity:1}

/* ================= PÁGINA ================= */
.view{padding:22px 24px 130px;max-width:1440px;margin:0 auto}
.page{animation:pageIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:34px;line-height:1}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:640px}
.page-head .eyebrow{margin-bottom:8px;display:flex;gap:8px;align-items:center}
.lens-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--lens-soft);color:var(--lens-ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

/* ================= BENTO / TARJETAS ================= */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.r2{grid-row:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0;position:relative;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:16px}
.tile{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;cursor:default}
.tile[data-trace]{cursor:pointer}
.tile[data-trace]:hover{transform:translateY(-3px);border-color:var(--lens-a);box-shadow:0 22px 40px -24px rgba(16,40,50,.5)}
.tile .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .val{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:-.03em;margin-top:8px;line-height:1.15;word-break:break-word}
.tile .sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile .trace-hint{position:absolute;top:14px;right:14px;opacity:0;transition:opacity .2s;color:var(--lens-a)}
.tile[data-trace]:hover .trace-hint{opacity:1}
.tile .trace-hint svg{width:15px;height:15px}
.hero{background:var(--lens-a);transition:background .5s;color:var(--struct-ink);border-color:transparent;min-height:260px;display:flex;flex-direction:column;justify-content:space-between}
.hero .lbl,.hero .sub{color:color-mix(in srgb,var(--struct-ink) 70%,transparent)}
.hero .val{font-size:46px}
.hero .flow{position:absolute;inset:0;pointer-events:none;opacity:.45}
.hero .flow path{fill:none;stroke-width:1.2;stroke-dasharray:4 10;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-140}}
.hero > *{position:relative}
.hero-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:16px}
.hero-steps div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;cursor:pointer;transition:background .2s}
.hero-steps div:hover{background:rgba(255,255,255,.16)}
.hero-steps span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.hero-steps b{font-family:var(--mono);font-size:13.5px;font-weight:600}
.gold-tile{background:linear-gradient(150deg,var(--gold-bg),var(--panel) 70%);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-weight:600;font-size:11.5px;padding:2px 7px;border-radius:999px}
.delta.up{background:var(--pos-bg);color:var(--pos)} .delta.down{background:var(--coral-bg);color:var(--coral)} .delta.flat{background:var(--bg-2);color:var(--muted)}
.hero .delta.up{background:rgba(115,194,158,.2);color:#BFE6D2} .hero .delta.down{background:rgba(232,144,122,.2);color:#F6C3B6}
.info-i{width:15px;height:15px;border-radius:50%;border:1px solid currentColor;display:inline-grid;place-items:center;font-size:9px;font-weight:700;cursor:help;opacity:.65;background:none;padding:0;color:inherit;font-family:var(--mono);flex:none}
.tip{position:fixed;z-index:400;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow-lg);pointer-events:none;animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bg-2);color:var(--ink-2);white-space:nowrap;font-family:var(--sans)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--pos-bg);color:var(--pos)} .badge.bad{background:var(--coral-bg);color:var(--coral)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.info{background:var(--info-bg);color:var(--info)} .badge.gold{background:var(--gold-bg);color:#8A6A2F}
:root[data-theme="dark"] .badge.gold{color:var(--gold)}
.origin{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.origin.importado{border-color:var(--info);color:var(--info)} .origin.integracion{border-color:var(--pos);color:var(--pos)} .origin.estimado{border-color:var(--warn);color:var(--warn);border-style:dashed}
.brand-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.brand-chip i{width:9px;height:9px;border-radius:3px;display:block;flex:none}

/* ================= BOTONES / FORMULARIOS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;font-size:13.5px;white-space:nowrap;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s;position:relative;overflow:hidden;text-decoration:none}
.btn:hover{border-color:var(--lens-a);transform:translateY(-1px)} .btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--struct);color:var(--struct-ink);border-color:transparent;box-shadow:0 10px 22px -14px var(--struct)}
.btn-primary:hover{border-color:transparent;box-shadow:0 14px 28px -14px var(--struct)}
.btn-lens{background:linear-gradient(135deg,var(--lens-a),var(--lens-b));color:#fff;border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent} .btn-ghost:hover{background:var(--bg-2);border-color:transparent}
.btn-danger{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 40%,transparent)} .btn-danger.solid{background:var(--coral);color:#fff;border-color:transparent}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .6s linear;background:rgba(255,255,255,.35);pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl-sm{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--muted)}
.input{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
textarea.input{resize:vertical;min-height:64px}
.input:focus{border-color:var(--lens-a);box-shadow:0 0 0 4px color-mix(in srgb,var(--lens-a) 16%,transparent)}
.input.invalid{border-color:var(--coral);box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 16%,transparent)}
.input.sm{padding:6px 9px;font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.form-sec{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px dashed var(--line-2);padding-top:12px;margin-top:4px}
.err-msg{color:var(--coral);font-size:12.5px;font-weight:600}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .25s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked{background:var(--pos)} .switch input:checked::after{transform:translateX(17px)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:var(--struct);width:16px;height:16px}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.pickchips label{cursor:pointer} .pickchips input{display:none}
.pickchips span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:600;transition:all .2s;background:var(--panel)}
.pickchips input:checked + span{background:var(--struct);color:var(--struct-ink);border-color:transparent}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px -4px rgba(16,40,50,.35)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap;font-size:13.5px}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--lens-a);animation:grow .3s ease}
@keyframes grow{from{transform:scaleX(0)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}

.bar-row .bv{font-family:var(--mono);font-size:12px;font-weight:600}
.bar-track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.div-track{grid-column:1/-1;height:10px;position:relative;background:var(--bg-2);border-radius:99px}

.div-fill{position:absolute;top:0;bottom:0;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

.bare{min-height:100vh;display:grid;place-items:center;padding:24px}

}

/* =====================================================================
   MONEDAS Y TIPOS DE CAMBIO
   ===================================================================== */
const base = () => state.settings.baseCurrency;
const curSym = code => state.settings.currencies.find(c => c.code === code)?.symbol || code || '';
function locale() { return state.settings.numFormat === 'en' ? 'en-US' : 'es-AR'; }
function fmtN(n, d = 2) { return Math.abs(Number(n) || 0).toLocaleString(locale(), { minimumFractionDigits: d, maximumFractionDigits: d }); }
function money(n, cur = base()) { return (Number(n) < 0 ? '−' : '') + (curSym(cur) ? curSym(cur) + ' ' : '') + fmtN(n); }
function moneyShort(n, cur = base()) {
  const a = Math.abs(n), sym = curSym(cur); let s;
  if (a >= 1e9) s = (a / 1e9).toLocaleString(locale(), { maximumFractionDigits: 1 }) + 'B';
  else if (a >= 1e6) s = (a / 1e6).toLocaleString(locale(), { maximumFractionDigits: 1 }) + 'M';
  else if (a >= 1e4) s = (a / 1e3).toLocaleString(locale(), { maximumFractionDigits: 0 }) + 'k';
  else s = a.toLocaleString(locale(), { maximumFractionDigits: a < 10 ? 2 : 0 });
  return (n < 0 ? '−' : '') + (sym ? sym + ' ' : '') + s;
}
const fnum = (n, d = 0) => (Number(n) || 0).toLocaleString(locale(), { maximumFractionDigits: d });
const pct = n => (Number(n) || 0).toLocaleString(locale(), { maximumFractionDigits: 1 }) + '%';
/* Tipo de cambio: 1 unidad de `cur` = rate unidades de la moneda de referencia. Usa el último ≤ fecha. */
function rateFor(cur, date) {
  if (!cur || cur === base()) return { rate: 1, date, source: 'misma moneda' };
  let best = null;
  for (const r of state.rates) if (r.currency === cur && r.date <= date && (!best || r.date > best.date)) best = r;
  return best;
}
/* Conversión explícita; si no hay tipo de cambio devuelve null (nunca se mezcla sin convertir) */
function conv(amount, cur, date, miss) {
  const r = rateFor(cur, date || todayStr());
  if (!r) { if (miss) miss.add(cur + '@' + (date || '')); return null; }
  return (Number(amount) || 0) * r.rate;
}

const PRESETS = [['hoy', 'Hoy'], ['semana', 'Últimos 7 días'], ['mes', 'Este mes'], ['mesAnt', 'Mes anterior'], ['trimestre', 'Este trimestre'], ['anio', 'Este año'], ['12m', 'Últimos 12 meses'], ['todo', 'Todo'], ['custom', 'Personalizado']];
function resolveRange(p = ui.period) {
  const t = todayStr(), d = new Date();
  switch (p.preset) {
    case 'hoy': return { from: t, to: t };
    case 'semana': return { from: addDays(t, -6), to: t };
    case 'mes': return { from: fmtDate(new Date(d.getFullYear(), d.getMonth(), 1)), to: t };
    case 'mesAnt': return { from: fmtDate(new Date(d.getFullYear(), d.getMonth() - 1, 1)), to: fmtDate(new Date(d.getFullYear(), d.getMonth(), 0)) };
    case 'trimestre': return { from: fmtDate(new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1)), to: t };
    case 'anio': return { from: `${d.getFullYear()}-01-01`, to: t };
    case '12m': return { from: addDays(addMonths(t, -12), 1), to: t };
    case 'todo': { const all = [...state.sales.map(s => s.date), ...state.expenses.map(e => e.date)].filter(Boolean).sort(); return { from: all[0] && all[0] < t ? all[0] : t, to: t }; }
    case 'custom': return { from: p.from || addDays(t, -29), to: p.to || t };
    default: return { from: addDays(t, -29), to: t };

}
function prevRange(r) { const len = daysBetween(r.from, r.to) + 1; return { from: addDays(r.from, -len), to: addDays(r.from, -1) }; }
const inR = (d, r) => d && d >= r.from && d <= r.to;

/* =====================================================================
   VENTAS: importes
   ===================================================================== */
function saleCalc(s) {
  const gross = round2((num(s.qty) || 0) * (num(s.unitPrice) || 0));
  const discount = round2(Math.min(gross, Math.max(0, num(s.discount) || 0)));
  const refunded = round2(Math.min(gross - discount, Math.max(0, num(s.refunded) || 0)));
  const net = round2(gross - discount - refunded);
  const commission = round2(Math.max(0, num(s.commission) || 0));
  const tax = round2(Math.max(0, num(s.tax) || 0));
  return { gross, discount, refunded, net, commission, tax, liquid: round2(net - commission - tax) };
}
const saleBrand = s => s.brandId || product(s.productId)?.brandId || proj(s.projectId)?.brandId || '';
const saleProject = s => s.projectId || product(s.productId)?.projectId || '';
const lensOk = brandId => ui.lens === 'all' || brandId === ui.lens;

/* =====================================================================
   GASTOS: estado y asignación (un gasto se cuenta UNA vez en el total)
   ===================================================================== */
const expStatus = e => e.status === 'pagado' ? 'pagado' : (e.dueDate && e.dueDate < todayStr() ? 'vencido' : 'pendiente');
function allocShares(e) {
  const a = e.alloc || { mode: 'general', targets: [] }, t = (a.targets || []).filter(x => x.id);
  if (a.mode === 'general' || !t.length) return [];
  if (a.mode === 'pct') return t.map(x => ({ type: x.type, id: x.id, share: (Number(x.pct) || 0) / 100 }));
  return t.map(x => ({ type: x.type, id: x.id, share: 1 / t.length }));
}
const shareBrand = sh => sh.type === 'brand' ? sh.id : proj(sh.id)?.brandId || '';
/* parte del gasto que corresponde a la lente actual (1 = todo) */
function expLensShare(e) {
  if (ui.lens === 'all') return 1;
  return allocShares(e).filter(sh => shareBrand(sh) === ui.lens).reduce((a, sh) => a + sh.share, 0);
}
const expProjectShare = (e, pid) => allocShares(e).filter(sh => sh.type === 'project' && sh.id === pid).reduce((a, sh) => a + sh.share, 0);
const expGroup = e => String(e.category || '').split(' › ')[0] || 'Sin categoría';

/* =====================================================================
   MÉTRICAS DEL PERÍODO (con lente de marca)
   ===================================================================== */
function metrics(r) {
  const miss = new Set();
  const m = { gross: 0, discount: 0, refunded: 0, net: 0, commission: 0, tax: 0, liquid: 0, collected: 0, expenses: 0, invest: 0, result: 0, salesCount: 0, units: 0, recurring: 0, oneTime: 0, unassigned: 0,
    byBrand: {}, byProduct: {}, byChannel: {}, byCountry: {}, byProject: {}, byDay: {}, expByGroup: {}, expByDay: {}, commByChannel: {}, customersNew: 0, customersRec: 0, miss };
  const firstBuy = {};
  for (const s of state.sales) if (s.status !== 'anulada' && s.customerId) { if (!firstBuy[s.customerId] || s.date < firstBuy[s.customerId]) firstBuy[s.customerId] = s.date; }
  const buyers = new Set();
  for (const s of state.sales) {
    if (s.status === 'anulada' || !inR(s.date, r)) continue;
    const b = saleBrand(s); if (!lensOk(b)) continue;
    const c = saleCalc(s), k = x => conv(x, s.currency, s.date, miss);
    const g = k(c.gross); if (g == null) continue;
    const net = k(c.net), com = k(c.commission), tax = k(c.tax);
    m.gross += g; m.discount += k(c.discount); m.refunded += k(c.refunded); m.net += net; m.commission += com; m.tax += tax; m.liquid += net - com - tax;
    m.salesCount++; m.units += num(s.qty) || 0;
    if (s.type === 'suscripcion') m.recurring += net; else m.oneTime += net;
    m.byBrand[b || '_'] = (m.byBrand[b || '_'] || 0) + net;
    if (s.productId) { const x = m.byProduct[s.productId] || (m.byProduct[s.productId] = { net: 0, units: 0 }); x.net += net; x.units += num(s.qty) || 0; }
    const ch = s.channelId || '_'; m.byChannel[ch] = (m.byChannel[ch] || 0) + net; m.commByChannel[ch] = (m.commByChannel[ch] || 0) + com;
    const co = s.country || 'Sin país'; m.byCountry[co] = (m.byCountry[co] || 0) + net;
    const pj = saleProject(s); if (pj) { const x = m.byProject[pj] || (m.byProject[pj] = { net: 0, cost: 0 }); x.net += net; x.cost += com + tax; }
    const dd = m.byDay[s.date] || (m.byDay[s.date] = { net: 0, exp: 0 }); dd.net += net - com - tax;
    if (s.customerId) buyers.add(s.customerId);
  }
  for (const cid of buyers) { if (inR(firstBuy[cid], r)) m.customersNew++; else m.customersRec++; }
  for (const t of state.treasury) {
    if (t.type !== 'cobro' || !inR(t.date, r)) continue;
    const s = byId(state.sales, t.saleId); const b = s ? saleBrand(s) : ''; if (!lensOk(b)) continue;
    const v = conv(t.amount, t.currency, t.date, miss); if (v != null) m.collected += v;
  }
  for (const e of state.expenses) {
    if (!inR(e.date, r)) continue;
    const share = expLensShare(e); if (!share) continue;
    const v = conv(e.amount, e.currency, e.date, miss); if (v == null) continue;
    const val = v * share;
    if (e.nature === 'inversion') { m.invest += val; continue; }
    m.expenses += val;
    if (ui.lens === 'all' && !allocShares(e).length) m.unassigned += val;
    const g = expGroup(e); m.expByGroup[g] = (m.expByGroup[g] || 0) + val;
    const dd = m.byDay[e.date] || (m.byDay[e.date] = { net: 0, exp: 0 }); dd.exp += val;
    for (const sh of allocShares(e)) if (sh.type === 'project') { const x = m.byProject[sh.id] || (m.byProject[sh.id] = { net: 0, cost: 0 }); x.cost += v * sh.share; }
  }
  m.result = m.net - m.commission - m.tax - m.expenses;
  for (const k of ['gross', 'discount', 'refunded', 'net', 'commission', 'tax', 'liquid', 'collected', 'expenses', 'invest', 'result', 'recurring', 'oneTime', 'unassigned']) m[k] = round2(m[k]);
  return m;
}

/* =====================================================================
   SUSCRIPCIONES (estado a una fecha a partir de sus eventos)
   ===================================================================== */
const planMonthly = p => p ? (p.period === 'anual' ? Number(p.price) / 12 : Number(p.price)) : 0;
function subStateAt(sub, d) {
  let st = 'none';
  for (const ev of [...sub.events].sort((a, b) => a.date.localeCompare(b.date))) {
    if (ev.date > d) break;
    if (ev.type === 'prueba') st = 'trial';
    else if (['alta', 'conversion', 'reactivacion', 'renovacion'].includes(ev.type)) st = 'paying';
    else if (ev.type === 'cancelacion') st = 'canceled';
    else if (ev.type === 'pausa') st = 'paused';
  }
  return st;
}
function subPlanAt(sub, d) { let pid = sub.planId; const evs = [...sub.events].sort((a, b) => a.date.localeCompare(b.date)); for (const ev of evs) { if (ev.date > d) break; if (ev.planId) pid = ev.planId; } return plan(pid) || plan(sub.planId); }
function saasMetrics(r) {
  const miss = new Set(), t = todayStr();
  const subs = state.subs.filter(s => lensOk(proj(s.projectId)?.brandId));
  const activeNow = subs.filter(s => s.status === 'activa');
  let mrr = 0; for (const s of activeNow) { const p = plan(s.planId); const v = conv(planMonthly(p), p?.currency, t, miss); if (v != null) mrr += v; }
  const startD = addDays(r.from, -1);
  const payingStart = subs.filter(s => subStateAt(s, startD) === 'paying').length;
  const ev = subs.flatMap(s => s.events.map(e => ({ ...e, sub: s }))).filter(e => inR(e.date, r));
  const cancels = ev.filter(e => e.type === 'cancelacion').length;
  const newPaying = ev.filter(e => e.type === 'alta' || e.type === 'conversion').length;
  const trials = ev.filter(e => e.type === 'prueba').length, conversions = ev.filter(e => e.type === 'conversion').length;
  const renewOk = ev.filter(e => e.type === 'renovacion').length, renewFail = ev.filter(e => e.type === 'pago_fallido').length;
  const months = Math.max(1, (daysBetween(r.from, r.to) + 1) / 30.4);
  const churn = payingStart > 0 ? cancels / payingStart * 100 : null;
  const churnMonthly = churn != null ? churn / months : null;
  const arpu = activeNow.length ? mrr / activeNow.length : null;
  const ltv = arpu != null && churnMonthly ? arpu / (churnMonthly / 100) : null;
  // CAC: gastos de Comercialización del período / clientes nuevos que pagan (suscripción o compra)
  let mkt = 0; for (const e of state.expenses) { if (!inR(e.date, r) || expGroup(e) !== 'Comercialización') continue; const sh = expLensShare(e); if (!sh) continue; const v = conv(e.amount, e.currency, e.date, miss); if (v != null) mkt += v * sh; }
  const mm = metrics(r); const newCust = mm.customersNew;
  const cac = mkt > 0 && newCust > 0 ? mkt / newCust : null;
  const trialEnded = ev.filter(e => e.type === 'conversion').length + subs.filter(s => s.events.some(e => e.type === 'prueba') && s.events.some(e => e.type === 'cancelacion' && inR(e.date, r)) && !s.events.some(e => e.type === 'conversion')).length;
  return { mrr: round2(mrr), arr: round2(mrr * 12), active: activeNow.length, trial: subs.filter(s => s.status === 'prueba').length, unpaid: subs.filter(s => s.status === 'impaga').length, payingStart, cancels, newPaying, trials, conversions, convRate: trialEnded ? conversions / trialEnded * 100 : null, renewOk, renewFail, churn, churnMonthly, arpu, ltv, cac, mkt: round2(mkt), newCust, miss };
}

/* =====================================================================
   RENTABILIDAD POR PROYECTO / APLICACIÓN
   ===================================================================== */
function projectPnL(pid, r) {
  const miss = new Set(); let rev = 0, com = 0, tax = 0, cost = 0, invest = 0, ads = 0, sales = 0;
  for (const s of state.sales) {
    if (s.status === 'anulada' || saleProject(s) !== pid || (r && !inR(s.date, r))) continue;
    const c = saleCalc(s); const n = conv(c.net, s.currency, s.date, miss); if (n == null) continue;
    rev += n; com += conv(c.commission, s.currency, s.date) || 0; tax += conv(c.tax, s.currency, s.date) || 0; sales++;

function toast(msg, tone = 'ok') {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast ' + tone; t.setAttribute('role', 'status');
  t.innerHTML = `<span class="tdot"></span><span>${esc(msg)}</span>`;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, tone === 'bad' ? 5200 : 3000);

let tipEl = null;
document.addEventListener('mouseover', e => {

  tipEl?.remove(); tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.textContent = el.dataset.tip; document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2));
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;

  sp.className = 'ripple'; sp.style.width = sp.style.height = s + 'px'; sp.style.left = (e.clientX - r.left - s / 2) + 'px'; sp.style.top = (e.clientY - r.top - s / 2) + 'px';

function openPalette(mode) {
  if ($('.palette')) return;
  const ov = document.createElement('div'); ov.className = 'overlay palette-ov';
  ov.innerHTML = `<div class="palette" role="dialog" aria-label="Paleta de comandos"><div class="pin">${ic('search')}<input placeholder="${mode === 'crear' ? 'Qué querés crear…' : 'Buscá una acción, sección, app, producto o cliente…'}" aria-label="Buscar"></div><div class="res"></div><div class="foot"><span><span class="kbd">↑↓</span> navegar</span><span><span class="kbd">↵</span> abrir</span><span><span class="kbd">esc</span> cerrar</span></div></div>`;
  document.body.appendChild(ov);
  const m = { el: ov, close() { ov.classList.add('closing'); setTimeout(() => ov.remove(), 180); const i = modalStack.indexOf(m); if (i >= 0) modalStack.splice(i, 1); } };
  modalStack.push(m);

  const inp = $('input', ov), res = $('.res', ov); let items = [], sel = 0;
  const build = () => {
    const q = norm(inp.value); const out = [];
    const add = (grp, icon, label, run, sub = '') => { if (!q || norm(label + ' ' + sub).includes(q)) out.push({ grp, icon, label, run, sub }); };

        state.products.forEach(p => add('Productos', 'ventas', p.name, () => openProduct(p.id), brand(p.brandId)?.name));
        state.customers.forEach(c => add('Clientes', 'clientes', c.name, () => openCustomer(c.id), c.email));
        state.resources.forEach(r => add('Infraestructura', 'infra', r.name, () => openResource(r.id), r.provider));
      }
    }
    items = out.slice(0, 40); sel = 0; draw();
  };
  const draw = () => {
    let h = '', g = '';
    items.forEach((it, i) => { if (it.grp !== g) { g = it.grp; h += `<div class="grp">${esc(g)}</div>`; } h += `<button class="it ${i === sel ? 'sel' : ''}" data-i="${i}">${ic(it.icon)}<span>${esc(it.label)}${it.sub ? ` <span class="muted small">· ${esc(it.sub)}</span>` : ''}</span>${i === sel ? '<span class="k kbd">↵</span>' : ''}</button>`; });
    res.innerHTML = h || '<p class="muted small" style="padding:12px">Sin resultados.</p>';
    res.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  };
  const run = i => { const it = items[i]; if (!it) return; m.close(); setTimeout(() => it.run(), 60); };

  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); draw(); } if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); } if (e.key === 'Enter') { e.preventDefault(); run(sel); } });
  res.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(Number(b.dataset.i)); });
  build(); setTimeout(() => inp.focus(), 30);
}

function netSVG() {
  let s = '<svg class="net" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">';
  const pts = []; for (let i = 0; i < 26; i++) pts.push([(i * 97) % 400, (i * 151 + 40) % 400]);
  pts.forEach((p, i) => pts.slice(i + 1).forEach(q => { const d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (d < 120) s += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#00D9FF" stroke-opacity="${(.35 - d / 400).toFixed(2)}" stroke-width=".8"/>`; }));
  const cols = ['#00D9FF', '#FF00FF', '#D9A5C4', '#C9756B', '#9EAD9D'];
  pts.forEach((p, i) => s += `<circle cx="${p[0]}" cy="${p[1]}" r="${2 + (i % 3)}" fill="${cols[i % 5]}"><animate attributeName="opacity" values=".3;1;.3" dur="${3 + (i % 4)}s" repeatCount="indefinite"/></circle>`);
  return s + '</svg>';
}

function drawMap(el, { mini = false } = {}) {
  if (!el) return;
  const W = Math.max(280, el.clientWidth), H = mini ? Math.min(300, W * .9) : Math.max(420, Math.min(620, W * .62)), cx = W / 2, cy = H / 2;
  const S = state.settings, R1 = Math.min(W, H) * .2, R2 = Math.min(W, H) * .36, R3 = Math.min(W, H) * .47;
  const allTime = { from: '0000-01-01', to: '9999-12-31' };
  const nodes = [], edges = [];
  nodes.push({ id: 'core', x: cx, y: cy, r: mini ? 14 : 20, fill: 'var(--struct)', label: mini ? '' : (S.business.name || 'Ecosistema') });
  const brands = S.brands; const bPos = {};
  brands.forEach((b, i) => { const a = i / Math.max(1, brands.length) * Math.PI * 2 - Math.PI / 2; const x = cx + Math.cos(a) * R1, y = cy + Math.sin(a) * R1; bPos[b.id] = { a, x, y }; nodes.push({ id: 'b:' + b.id, x, y, r: mini ? 10 : 15, fill: b.color, label: b.name, act: `data-act="setLens" data-id="${b.id}"` }); edges.push([cx, cy, x, y, true]); });
  const pPos = {};
  brands.forEach(b => {
    const ps = state.projects.filter(p => p.brandId === b.id), prods = state.products.filter(p => p.brandId === b.id && !p.projectId);
    const items = [...ps.map(p => ({ t: 'p', p })), ...(prods.length ? [{ t: 'catalog', n: prods.length }] : [])];
    const spread = Math.PI * 2 / Math.max(1, brands.length) * .8;
    items.forEach((it, j) => {
      const a = bPos[b.id].a + (items.length > 1 ? (j / (items.length - 1) - .5) * spread : 0), x = cx + Math.cos(a) * R2, y = cy + Math.sin(a) * R2;
      if (it.t === 'p') { const pl = projectPnL(it.p.id, allTime); const rr = Math.max(mini ? 4 : 6, Math.min(mini ? 10 : 18, 5 + Math.sqrt(Math.max(0, pl.rev)) / 30)); pPos[it.p.id] = { x, y, a }; nodes.push({ id: 'p:' + it.p.id, x, y, r: rr, fill: 'var(--panel)', stroke: pl.op >= 0 ? 'var(--pos)' : 'var(--coral)', label: mini ? '' : it.p.name, act: `data-act="openProjectEl" data-id="${it.p.id}"`, title: `${it.p.name} · ingresos ${money(pl.rev)} · resultado ${money(pl.op)}` }); }
      else nodes.push({ id: 'c:' + b.id, x, y, r: mini ? 6 : 10, fill: b.alt || b.color, label: mini ? '' : `${it.n} producto${it.n > 1 ? 's' : ''}`, act: `data-act="setLensGo" data-id="${b.id}" data-r="ventas"` });
      edges.push([bPos[b.id].x, bPos[b.id].y, x, y, false]);
    });
  });
  const res = state.resources.filter(r => r.status !== 'cancelado');
  res.forEach((r, i) => {
    const linked = (r.projectIds || []).map(id => pPos[id]).filter(Boolean);
    const a = linked.length ? Math.atan2(sum(linked, p => Math.sin(p.a)), sum(linked, p => Math.cos(p.a))) + (i % 3 - 1) * .12 : i / Math.max(1, res.length) * Math.PI * 2;
    const x = cx + Math.cos(a) * R3, y = cy + Math.sin(a) * R3;
    nodes.push({ id: 'r:' + r.id, x, y, r: mini ? 3.5 : 6, fill: r.status === 'sin_uso' ? 'var(--warn)' : 'var(--c5)', label: mini ? '' : r.name, small: true, act: `data-act="openResourceEl" data-id="${r.id}"`, title: `${statusOf(RES_TYPES, r.type).label}: ${r.name}` });
    linked.forEach(p => edges.push([x, y, p.x, p.y, false, true]));
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa del ecosistema">
    <circle class="ring" cx="${cx}" cy="${cy}" r="${R1}"/><circle class="ring" cx="${cx}" cy="${cy}" r="${R2}"/>${res.length ? `<circle class="ring" cx="${cx}" cy="${cy}" r="${R3}"/>` : ''}
    ${edges.map(e => `<path class="edge ${e[4] ? 'flowing' : ''}" d="M${e[0]},${e[1]} L${e[2]},${e[3]}" ${e[5] ? 'stroke-dasharray="2 4" opacity=".6"' : ''}/>`).join('')}
    ${nodes.map((n, i) => `<g class="node" ${n.act || ''} style="animation:pageIn .5s ${i * .03}s both"><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${n.fill}" stroke="${n.stroke || 'var(--panel)'}" stroke-width="${n.stroke ? 3 : 2}"><title>${esc(n.title || n.label)}</title></circle>${n.label ? `<text x="${n.x}" y="${n.y + n.r + 13}" text-anchor="middle" style="font-size:${n.small ? 9.5 : 11}px;${n.small ? 'fill:var(--muted)' : 'font-weight:600'}">${esc(n.label.length > 22 ? n.label.slice(0, 21) + '…' : n.label)}</text>` : ''}</g>`).join('')}
  </svg>`;
  el.innerHTML = svg + (!mini ? `<div class="legend" style="justify-content:center;margin-top:8px"><span><i style="background:var(--struct)"></i>Ecosistema</span><span><i style="border:2px solid var(--pos);background:none"></i>App con resultado ≥ 0</span><span><i style="border:2px solid var(--coral);background:none"></i>App con resultado negativo</span><span><i style="background:var(--c5)"></i>Infraestructura</span><span><i style="background:var(--warn)"></i>Recurso sin uso</span></div>` : '');
}

    ${sec('gastos', 'Categorías de gastos', 'Grupos y subcategorías.', `${S.expenseGroups.map((g, gi) => `<div style="margin-bottom:12px"><div class="lbl-sm" style="margin-bottom:6px;display:flex;justify-content:space-between">${esc(g.name)}<button class="btn btn-sm btn-ghost" data-act="rmGroup" data-i="${gi}">${ic('trash')}</button></div>${listEdit('eg:' + gi, g.items, 'Nueva subcategoría…')}</div>`).join('')}<form class="addrow" data-addgroup><input class="input sm" placeholder="Nuevo grupo…"><button class="btn btn-sm">${ic('plus')}</button></form>`)}
    ${sec('pagos', 'Medios de pago y cuentas', 'Medios con que pagás gastos; cuentas donde entra y sale el dinero.', `<div class="lbl-sm" style="margin-bottom:6px">Medios de pago</div>${listEdit('payMethods', S.payMethods, 'Tarjeta, transferencia…')}<div class="lbl-sm" style="margin:14px 0 6px">Cuentas</div>${S.accounts.map(a => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b style="flex:1">${esc(a.name)}</b><span class="badge">${esc(a.currency)}</span><span class="mono small">${money(accountBalance(a.id), a.currency)}</span><button class="btn btn-sm btn-ghost" data-act="rmAccount" data-id="${a.id}">${ic('trash')}</button></div>`).join('')}<form class="addrow" data-addaccount><input class="input sm" placeholder="Nombre de la cuenta"><select class="input sm" style="max-width:90px">${curOpts()}</select><button class="btn btn-sm">${ic('plus')}</button></form>`)}
    ${sec('alertas', 'Alertas y valor hora', 'Umbrales de las alertas automáticas.', `<form id="f-al" class="form-grid">${field('Avisar vencimientos con (días)', `<input class="input" type="number" min="1" name="upcomingDays" value="${S.alerts.upcomingDays}">`)}${field('App sin ventas tras (días)', `<input class="input" type="number" min="1" name="noSalesDays" value="${S.alerts.noSalesDays}">`)}${field('Caída de canal mayor a (%)', `<input class="input" type="number" min="1" max="100" name="dropPct" value="${S.alerts.dropPct}">`)}${field('Valor de tu hora (opcional)', `<div class="addrow"><input class="input" type="number" min="0" step="any" name="rate" value="${S.hourly.rate ?? ''}"><select class="input" name="hcur" style="max-width:90px">${curOpts(S.hourly.currency)}</select></div>`, '', 'Para estimar el costo del tiempo de mantenimiento.')}</form><div class="btn-row" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-act="saveAl">Guardar</button></div>`)}
    ${sec('seguridad', 'Seguridad y ambiente', 'El PIN bloquea el panel en este navegador. El ambiente de pruebas usa datos totalmente separados.', `<div class="btn-row" style="margin-bottom:14px"><button class="btn btn-sm" data-act="setPin">${ic('lock')} ${S.pin ? 'Cambiar o quitar PIN' : 'Definir PIN'}</button></div><label class="switch"><input type="checkbox" data-change="toggleEnv" ${DataStore.env === 'pruebas' ? 'checked' : ''}><span><b>Ambiente de pruebas</b><br><span class="small muted">Ahora: ${DataStore.env === 'pruebas' ? 'PRUEBAS' : 'producción'}</span></span></label>`)}
    ${sec('respaldo', 'Respaldo de datos', `Datos guardados en ${esc(DataStore.label)}. Descargá respaldos seguido.`, `<div class="btn-row"><button class="btn btn-sm" data-act="backup">${ic('download')} Descargar .json</button><label class="btn btn-sm">${ic('upload')} Restaurar<input type="file" accept=".json" hidden id="restoreF"></label><button class="btn btn-sm btn-danger" data-act="wipe">${ic('trash')} Borrar todo</button></div><p class="tiny muted" style="margin-bottom:0">${state.sales.length} ventas · ${state.expenses.length} gastos · ${state.subs.length} suscripciones · ${state.projects.length} apps · ~${fnum(JSON.stringify(state).length / 1048576, 2)} MB</p>`)}
    </div>`;
    return h;
  },
  after() {
    $$('[data-additem]').forEach(f => f.addEventListener('submit', e => { e.preventDefault(); addItem(f.dataset.additem, f.querySelector('input').value); }));
    $('[data-addbrand]')?.addEventListener('submit', e => { e.preventDefault(); const v = e.target.querySelector('input').value.trim(); if (!v) return; if (findByName(state.settings.brands, v)) { toast('Ya existe', 'bad'); return; } cfgSave(st => st.settings.brands.push({ id: uid('br'), name: v, color: '#6E8CA0', dark: '#173F4F', alt: '#C5A46D', desc: '' })); });
    $('[data-addcur]')?.addEventListener('submit', e => { e.preventDefault(); const [c, s] = e.target.querySelectorAll('input'); const code = c.value.trim().toUpperCase(); if (!/^[A-Z]{3,5}$/.test(code)) { toast('Código inválido', 'bad'); return; } if (state.settings.currencies.some(x => x.code === code)) { toast('Ya existe', 'bad'); return; } cfgSave(st => st.settings.currencies.push({ code, symbol: s.value.trim() || code })); });
    $('[data-addchannel]')?.addEventListener('submit', e => { e.preventDefault(); const v = e.target.querySelector('input').value.trim(); if (!v || findByName(state.settings.channels, v)) return; cfgSave(st => st.settings.channels.push({ id: uid('ch'), name: v, commission: null })); });
    $('[data-addgroup]')?.addEventListener('submit', e => { e.preventDefault(); const v = e.target.querySelector('input').value.trim(); if (!v || state.settings.expenseGroups.some(g => norm(g.name) === norm(v))) return; cfgSave(st => st.settings.expenseGroups.push({ name: v, items: [] })); });
    $('[data-addaccount]')?.addEventListener('submit', e => { e.preventDefault(); const v = e.target.querySelector('input').value.trim(), c = e.target.querySelector('select').value; if (!v) return; cfgSave(st => st.settings.accounts.push({ id: uid('ac'), name: v, currency: c })); });
    $$('[data-bc]').forEach(i => i.addEventListener('change', () => { const v = i.value.trim(); if (i.dataset.k === 'name' && !v) return; cfgSave(st => { st.settings.brands.find(b => b.id === i.dataset.bc)[i.dataset.k] = v; }, true); }));
    $$('[data-ch]').forEach(i => i.addEventListener('change', () => { const k = i.dataset.k; let v = i.value.trim(); if (k === 'commission') { v = v === '' ? null : num(v); if (v != null && (v < 0 || v >= 100)) { toast('Comisión inválida', 'bad'); return; } } else if (!v) return; cfgSave(st => { st.settings.channels.find(c => c.id === i.dataset.ch)[k] = v; }, true); }));
    $('#restoreF')?.addEventListener('change', restoreBackup);
  }
};
async function cfgSave(fn, quiet) { try { await transact('cfg', st => { fn(st); logAct(st, 'Ajustes', ''); }); if (!quiet) toast('Guardado'); const y = window.scrollY; render(); window.scrollTo(0, y); } catch (e) { } }
function pathList(st, path) { if (path.startsWith('cat:')) return null; if (path.startsWith('eg:')) return st.settings.expenseGroups[Number(path.slice(3))].items; return st.settings[path]; }
function addItem(path, v) { v = String(v || '').trim(); if (!v) return; if (path.startsWith('cat:')) { const b = path.slice(4); if (state.settings.categories.some(c => c.brandId === b && norm(c.name) === norm(v))) { toast('Ya existe', 'bad'); return; } return cfgSave(st => st.settings.categories.push({ brandId: b, name: v })); } const L0 = pathList(state, path); if (L0.some(x => norm(x) === norm(v))) { toast('Ya existe', 'bad'); return; } cfgSave(st => pathList(st, path).push(v)); }
ACT.rmItem = el => { const path = el.dataset.path, i = Number(el.dataset.i); if (path.startsWith('cat:')) { const b = path.slice(4); const name = state.settings.categories.filter(c => c.brandId === b)[i]?.name; return cfgSave(st => { st.settings.categories = st.settings.categories.filter(c => !(c.brandId === b && c.name === name)); }); } cfgSave(st => pathList(st, path).splice(i, 1)); };
ACT.rmGroup = async el => { const g = state.settings.expenseGroups[Number(el.dataset.i)]; if (!(await confirmDialog({ title: 'Quitar grupo', message: `¿Quitar “${esc(g.name)}”? Los gastos existentes conservan su categoría.`, ok: 'Quitar', tone: 'danger' }))) return; cfgSave(st => st.settings.expenseGroups.splice(Number(el.dataset.i), 1)); };
ACT.rmBrand = async el => { const id = el.dataset.id; if (state.projects.some(p => p.brandId === id) || state.products.some(p => p.brandId === id) || state.sales.some(s => saleBrand(s) === id)) { toast('La marca tiene apps, productos o ventas: no se puede quitar.', 'bad'); return; } if (!(await confirmDialog({ title: 'Quitar marca', message: '¿Quitar esta marca?', ok: 'Quitar', tone: 'danger' }))) return; if (ui.lens === id) { ui.lens = 'all'; saveUI(); } cfgSave(st => { st.settings.brands = st.settings.brands.filter(b => b.id !== id); st.settings.categories = st.settings.categories.filter(c => c.brandId !== id); }); };
ACT.rmCur = el => { const c = el.dataset.c; if (state.sales.some(s => s.currency === c) || state.expenses.some(e => e.currency === c) || state.plans.some(p => p.currency === c) || state.settings.accounts.some(a => a.currency === c)) { toast('La moneda está en uso.', 'bad'); return; } cfgSave(st => { st.settings.currencies = st.settings.currencies.filter(x => x.code !== c); st.rates = st.rates.filter(r => r.currency !== c); }); };
ACT.rmChannel = el => { if (state.sales.some(s => s.channelId === el.dataset.id)) { toast('El canal tiene ventas: renombralo en lugar de quitarlo.', 'bad'); return; } cfgSave(st => { st.settings.channels = st.settings.channels.filter(c => c.id !== el.dataset.id); }); };
ACT.rmAccount = el => { if (state.treasury.some(t => t.accountFrom === el.dataset.id || t.accountTo === el.dataset.id)) { toast('La cuenta tiene movimientos.', 'bad'); return; } cfgSave(st => { st.settings.accounts = st.settings.accounts.filter(a => a.id !== el.dataset.id); }); };
ACT.saveNeg = () => { const d = formData($('#f-neg')); if (!d.name) { toast('El nombre es obligatorio', 'bad'); return; } cfgSave(st => { Object.assign(st.settings.business, { name: d.name, owner: d.owner, site: d.site }); st.settings.numFormat = d.numFormat; if (d.base && !st.rates.length) st.settings.baseCurrency = d.base; }); };
ACT.saveAl = () => { const d = formData($('#f-al')); const a = num(d.upcomingDays), b = num(d.noSalesDays), c = num(d.dropPct), h = d.rate === '' ? null : num(d.rate); if (!(a > 0 && b > 0 && c > 0 && c <= 100) || (h != null && h < 0)) { toast('Valores inválidos', 'bad'); return; } cfgSave(st => { st.settings.alerts = { upcomingDays: a, noSalesDays: b, dropPct: c }; st.settings.hourly = { rate: h, currency: d.hcur }; }); };
ACT.setPin = async () => { const r = await confirmDialog({ title: 'PIN de acceso', message: 'Dejalo vacío para quitarlo. De 4 a 8 números.', ok: 'Guardar', extra: field('Nuevo PIN', '<input class="input" name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">') }); if (!r) return; if (r.pin && !/^\d{4,8}$/.test(r.pin)) { toast('El PIN debe tener 4 a 8 números', 'bad'); return; } unlocked = true; await cfgSave(st => { st.settings.pin = r.pin; }); $('#root').innerHTML = ''; render(); };
CHG.toggleEnv = async el => { const to = el.checked ? 'pruebas' : 'produccion'; if (!(await confirmDialog({ title: 'Cambiar de ambiente', message: `Vas a pasar al ambiente de <b>${to === 'pruebas' ? 'PRUEBAS' : 'producción'}</b>. Sus datos están separados; el otro ambiente no se modifica.`, ok: 'Cambiar' }))) { el.checked = !el.checked; return; } try { localStorage.setItem('eco-env', to); } catch (e) { } location.reload(); };
ACT.backup = () => { downloadFile(`respaldo_centro_${DataStore.env}_${todayStr()}.json`, JSON.stringify(state), 'application/json'); toast('Respaldo descargado'); };
function deepMerge(a, b) { const o = clone(a); for (const [k, v] of Object.entries(b || {})) o[k] = v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' ? deepMerge(o[k], v) : v; return o; }
function normalizeState(data) { const b = emptyState(); for (const k of Object.keys(b)) if (!(k in data)) data[k] = b[k]; data.settings = deepMerge(b.settings, data.settings); return data; }
async function restoreBackup(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return; let data; try { data = JSON.parse(await f.text()); } catch (er) { toast('Archivo inválido', 'bad'); return; }
  if (!data || data.version !== 1 || !data.settings || !Array.isArray(data.sales)) { toast('No es un respaldo de este panel', 'bad'); return; }
  if (!(await confirmDialog({ title: 'Restaurar respaldo', message: `Se reemplazan TODOS los datos del ambiente actual (${data.sales.length} ventas, ${data.expenses?.length || 0} gastos).`, ok: 'Reemplazar', tone: 'danger' }))) return;
  try { await transact('restore', () => { state = normalizeState(data); logAct(state, 'Respaldo restaurado', f.name); }); unlocked = !state.settings.pin; $('#root').innerHTML = ''; render(); toast('Respaldo restaurado'); } catch (er) { }
}
ACT.wipe = async () => { const r = await confirmDialog({ title: 'Borrar todo', message: 'Se eliminan todos los datos de este ambiente. Escribí BORRAR.', ok: 'Borrar', tone: 'danger', extra: '<input class="input" name="c" autocomplete="off">' }); if (!r || r.c !== 'BORRAR') { if (r) toast('No se borró nada', 'bad'); return; } state = emptyState(); await DataStore.save(state); $('#root').innerHTML = ''; render(); };

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async function boot() {
  try { const saved = await DataStore.load(); if (saved && saved.version === 1) state = normalizeState(saved); } catch (e) { console.error(e); }
  if (!state.settings.pin) unlocked = true;
  if (ui.lens !== 'all' && !brand(ui.lens)) ui.lens = 'all';
  const r = location.hash.replace('#/', ''); if (r && VIEWS[r]) ui.route = r;
  applyTheme(); render();
})();
</script></body></html>
